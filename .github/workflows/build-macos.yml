name: Build macOS app (Intel x86_64)

on:
  push:
    branches: [ main ]
    # The repo also hosts the unrelated bookformatter/ project; changes there
    # must not trigger a Florida rebuild. Everything else still does.
    paths-ignore:
      - 'bookformatter/**'
      - '.github/workflows/build-bookformatter.yml'
  workflow_dispatch:
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  build:
    # Use the FAST, always-available Apple Silicon runner (macos-13 Intel
    # runners are being retired and queue for a long time), but build an
    # INTEL x86_64 app on it by running an Intel Python under Rosetta 2. The
    # result runs on Intel Macs natively and on Apple Silicon via Rosetta.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Rosetta 2 is available
        run: softwareupdate --install-rosetta --agree-to-license || true

      # actions/setup-python does NOT provide an Intel build on Apple Silicon
      # runners (it returns arm64), so install a real x86_64 Python via the
      # Miniforge Intel installer. Running that x86_64 python under Rosetta
      # reports machine == 'x86_64', so pip pulls Intel wheels and PyInstaller
      # produces an Intel app.
      - name: Set up Intel (x86_64) Python via Miniforge
        run: |
          set -e
          curl -L -o miniforge.sh \
            "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-MacOSX-x86_64.sh"
          bash miniforge.sh -b -p "$HOME/mf-x64"
          "$HOME/mf-x64/bin/conda" create -y -n build python=3.11 tk
          # Put the Intel env first on PATH for all later steps.
          echo "$HOME/mf-x64/envs/build/bin" >> "$GITHUB_PATH"

      - name: Confirm interpreter is Intel x86_64
        run: |
          which python
          python -c "import platform; print('machine:', platform.machine()); assert platform.machine() == 'x86_64', 'Expected x86_64 Python'"
          python -c "import tkinter; print('tkinter OK')"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Sanity check (source compiles)
        run: python -m compileall app run_app.py

      - name: Regenerate Buy Boxes template (no real contacts)
        run: python tools/make_template_workbook.py template/Master_Buyer_Buy_Boxes.xlsx

      - name: Build .app
        run: pyinstaller --noconfirm --clean FloridaLandMachine.spec

      - name: Assemble ready-to-use folder
        run: |
          STAGE="dist/Florida Land Machine"
          mkdir -p "$STAGE/Input"
          mv "dist/Florida Land Machine.app" "$STAGE/"
          cp "QUICK START.txt" "$STAGE/"
          # Executable double-click launcher (de-quarantines + opens the app).
          cp "launcher/Run Florida Land Machine.command" "$STAGE/"
          chmod +x "$STAGE/Run Florida Land Machine.command"
          # Make the app's inner binary executable too (belt and suspenders).
          chmod +x "$STAGE/Florida Land Machine.app/Contents/MacOS/"* || true
          # Placeholder so the empty Input folder survives zipping.
          echo "Put each county's downloaded files in a subfolder here (e.g. Input/St Lucie/)." > "$STAGE/Input/READ ME - put county folders here.txt"

      - name: Zip the app folder (preserves permissions)
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
            "Florida Land Machine" "FloridaLandMachine-macos-x86_64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloridaLandMachine-macos-x86_64
          path: dist/FloridaLandMachine-macos-x86_64.zip
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FloridaLandMachine-macos-x86_64.zip
